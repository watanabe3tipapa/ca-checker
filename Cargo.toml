[workspace]
resolver = "3"
members = [
    "crates/cert_core",
    "crates/cert_infra",
    "crates/cert_cli",
    "crates/app",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
x509-parser = { version = "0.18.1", features = ["verify"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103.16", features = ["ring"] }
rustls-pki-types = "1.12"
rustls-native-certs = "0.8.5"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-terminal = "0.1"
portable-pty = "0.9"
parking_lot = "0.12"
notify-rust = "4"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }
x509-ocsp = { version = "0.2", features = ["builder", "std"] }
x509-cert = "0.2"
der = { version = "0.7", features = ["std"] }
ring = "0.17"

cert_core = { path = "crates/cert_core" }
cert_infra = { path = "crates/cert_infra" }

rcgen = "0.14"
time = "0.3"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
